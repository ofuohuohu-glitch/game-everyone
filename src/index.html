<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>5連勝じゃんけんゲーム</title>
  <link rel="stylesheet" href="style_uchibe_1.css">
  <link rel="stylesheet" href="style_Hayakawa.css">
  <link rel="stylesheet" href="style_TakeNakaMatsu.css">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!--スタート画面-->
  <div id="start-screen">
    <h1 class="start-title">じゃんけんゲーム</h1>
    <button class="start-button" onclick="startGame()">スタート</button>
  </div>

  <!--ゲーム画面-->
  <div id="game-screen" style="display:none">

    <div class="hands-area">
      <div class="hand-box">
        <p id="cpuDisplay">CPU：</p>
        <img id="cpu-hand-image" src="button_gu.png" alt="CPUの手">
      </div>

      <div class="hand-box">
        <p id="playerDisplay">あなた：</p>
        <img id="player-hand-image" src="button_gu.png" alt="あなたの手">
      </div>
    </div>

    <p id="resultDisplay"></p>
    <p id="streakDisplay">現在の連勝数：0</p>

    <div class="button-area">
      <button class="hand-gu image-button" onclick="selectHand('グー')">
        <img src="gu.png" alt="ぐー">
      </button>

      <button class="hand-tyoki image-button" onclick="selectHand('チョキ')">
        <img src="tyoki.png" alt="ちょき">
      </button>

      <button class="hand-pa image-button" onclick="selectHand('パー')">
        <img src="pa.png" alt="ぱー">
      </button>
    </div>

  </div>
  <div id="resultOverlay" onclick="closeOverlay()"></div>

  <div id="clearOverlay">
    <p id="clearText">🎉 5連勝おめでとう！ 🎉</p>
    <button id="backButton" onclick="goToStart()">スタートに戻る</button>
  </div>

  <!-- p5.js と sketch.js を読み込む -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>

</body>
</html>
